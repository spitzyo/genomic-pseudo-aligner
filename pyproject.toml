[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "genomic-pseudo-aligner"
version = "0.3.0"
description = "k-mer based pseudo-aligner with coverage and variant tracking"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/spitzyo/genomic-pseudo-aligner"

[project.scripts]
genomic-pseudo-aligner = "genomic_pseudo_aligner.cli:main"

[tool.setuptools]
packages = ["genomic_pseudo_aligner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
