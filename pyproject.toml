[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "genomic-pseudo-aligner"
version = "0.2.0"
description = "k-mer based pseudo-aligner with coverage and variant tracking"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/spitzyo/genomic-pseudo-aligner"

[project.scripts]
genomic-pseudo-aligner = "main:main"

[tool.setuptools]
# Flat top-level modules, so `python main.py` keeps working from a checkout
# and .kdb/.aln pickles (which store module paths such as kmers.Reference)
# load the same way from a checkout and from an installed copy.
py-modules = [
    "aligner",
    "basic_tasks",
    "extcoverage",
    "extvartrack",
    "helper_functions",
    "kmers",
    "main",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
